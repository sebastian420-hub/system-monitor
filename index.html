<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <style>
    :root {
      --bg: #1e1e1e; --panel: #282828; --text: #ececec; --muted: #888; --dim: #666;
      --track: #444; --border: #3e3e42; --btn: #333;
      --accent: #0A84FF; --cpu: #32d74b; --gpu: #bf5af2; --ram: #0A84FF;
      --warn: #ffd60a; --hot: #ff453a;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f5f7; --panel: #fff; --text: #1d1d1f; --muted: #6e6e73; --dim: #8e8e93;
        --track: #e0e0e5; --border: #d2d2d7; --btn: #ececf0;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; overflow: hidden; background: transparent; color: var(--text);
      font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    .container {
      height: 100vh; padding: 12px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 10px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .title { font-weight: 600; font-size: 13px; text-align: center; color: var(--muted); }
    .modes { display: flex; justify-content: center; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
    .modes button {
      background: var(--btn); color: var(--muted); border: 1px solid var(--border);
      padding: 3px 10px; border-radius: 12px; font-size: 11px; cursor: pointer;
    }
    .modes button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
    .head { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 6px; }
    .bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
    .bar i {
      display: block; height: 100%; width: 100%; background: var(--c);
      transform: scaleX(0); transform-origin: left; transition: transform .4s ease-out;
    }
    .bar.warn i { background: var(--warn); }
    .bar.hot i { background: var(--hot); }
    .sub { display: flex; justify-content: space-between; gap: 6px; margin-top: 6px; font-size: 10px; color: var(--muted); }
    .sub span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; color: var(--muted); }
    .grid small { display: block; font-size: 9px; color: var(--dim); }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">System Monitor</div>
    <div class="modes">
      Menu Bar:
      <button data-mode="CPU">CPU</button>
      <button data-mode="GPU">GPU</button>
      <button data-mode="RAM">RAM</button>
    </div>

    <div class="box">
      <div class="head"><span>CPU</span><span id="cpuText">--</span></div>
      <div class="bar" id="cpuBar" style="--c:var(--cpu)"><i></i></div>
      <div class="sub"><span id="cpuModel">Loading…</span></div>
    </div>

    <div class="box">
      <div class="head"><span>GPU</span><span id="gpuText">--</span></div>
      <div class="bar" id="gpuBar" style="--c:var(--gpu)"><i></i></div>
      <div class="sub"><span id="gpuModel">Loading…</span></div>
    </div>

    <div class="box">
      <div class="head"><span>Memory</span><span id="memText">--</span></div>
      <div class="bar" id="memBar" style="--c:var(--ram)"><i></i></div>
      <div class="sub"><span id="memUsed">Used --</span><span id="memSwap"></span><span id="memTotal">Total --</span></div>
    </div>

    <div class="box grid">
      <div><small>CORES</small><span id="infoCores">--</span></div>
      <div><small>UPTIME</small><span id="infoUptime">--</span></div>
      <div><small>IP ADDRESS</small><span id="infoIp">--</span></div>
      <div><small>OS</small><span id="infoOs">--</span></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const shown = {}; // last value written per element, to skip no-op DOM writes

    function text(id, value) {
      if (shown[id] !== value) { shown[id] = value; $(id).textContent = value; }
    }

    function bar(id, pct) {
      const v = Math.min(100, Math.max(0, pct || 0));
      $(id).firstChild.style.transform = `scaleX(${v / 100})`;
      const level = v > 80 ? 'bar hot' : v > 50 ? 'bar warn' : 'bar';
      if ($(id).className !== level) $(id).className = level;
    }

    function setActive(mode) {
      document.querySelectorAll('.modes button').forEach((b) => {
        b.classList.toggle('active', b.dataset.mode === mode);
      });
    }

    document.querySelector('.modes').addEventListener('click', (e) => {
      const mode = e.target.dataset && e.target.dataset.mode;
      if (!mode) return;
      setActive(mode);
      window.monitor.setMode(mode);
    });

    window.monitor.getStatic().then((s) => {
      setActive(s.mode);
      text('cpuModel', s.cpuModel);
      text('infoCores', `${s.cores}`);
      text('infoOs', s.os);
      text('gpuModel', s.gpuModel || (s.gpuSupported ? 'Unknown GPU' : 'Not available on this OS'));
      if (!s.gpuSupported) text('gpuText', 'N/A');
      window.__gpuSupported = s.gpuSupported;
    });

    window.monitor.onStats((d) => {
      text('cpuText', `${d.cpu.toFixed(1)}%`);
      bar('cpuBar', d.cpu);

      if (window.__gpuSupported !== false && d.gpu != null) {
        text('gpuText', `${d.gpu}%`);
        bar('gpuBar', d.gpu);
      }

      text('memText', `${d.mem.toFixed(1)}%`);
      bar('memBar', d.mem);
      text('memUsed', `Used ${d.memUsed}`);
      text('memSwap', d.swap ? `Swap ${d.swap}` : '');
      text('memTotal', `Total ${d.memTotal}`);

      text('infoUptime', d.uptime);
      text('infoIp', d.ip);
    });
  </script>
</body>
</html>
